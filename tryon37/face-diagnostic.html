<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Face Diagnostic v39</title>
<style>
body{margin:0;background:#111;color:white;font-family:system-ui}video,canvas{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}canvas{pointer-events:none}
#s{position:fixed;top:10px;left:10px;right:10px;z-index:5;background:#000c;padding:10px;border-radius:12px;font:13px monospace;direction:ltr}
</style>
<video id="v" autoplay playsinline muted></video><canvas id="c"></canvas><div id="s">starting…</div>
<script type="module">
import {FaceLandmarker,FilesetResolver,DrawingUtils} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/+esm";
const v=document.querySelector('#v'), c=document.querySelector('#c'), s=document.querySelector('#s'), ctx=c.getContext('2d');
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
v.srcObject=stream; await v.play();
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22-rc.20250304/wasm");
let lm, delegate='GPU', err='';
for(const d of ['GPU','CPU']){
 try{
  lm=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:d},runningMode:'VIDEO',numFaces:1,outputFacialTransformationMatrixes:true});
  delegate=d; break;
 }catch(e){err=e.message||String(e)}
}
if(!lm){s.textContent='FAILED '+err; throw new Error(err)}
const draw=new DrawingUtils(ctx); let last=-1, faces=0, ms=0, failures=0;
function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',resize);resize();
function loop(){
 requestAnimationFrame(loop);
 if(v.readyState<2||v.currentTime===last)return; last=v.currentTime;
 const t0=performance.now();
 try{
  const r=lm.detectForVideo(v,performance.now()); ms=performance.now()-t0; faces=r.faceLandmarks?.length||0;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(faces){
    const pts=r.faceLandmarks[0].map(p=>({x:1-p.x,y:p.y,z:p.z}));
    draw.drawConnectors(pts, FaceLandmarker.FACE_LANDMARKS_FACE_OVAL,{lineWidth:2});
  }
  s.textContent=`v39 diagnostic | delegate:${delegate} | faces:${faces} | detect:${ms.toFixed(1)}ms | ${v.videoWidth}x${v.videoHeight} | failures:${failures}`;
 }catch(e){failures++;s.textContent='detect error: '+(e.message||e)}
}
loop();
</script></html>
