<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التقديم على وظيفة — echarpe · Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  /* ============================================================
     نفس متغيرات وكلاسات دليل الموظفة.
     الفرق الوحيد: الترويسة بيضاء هادية بدل الغلاف الوردي الكبير —
     ده نموذج بيتملى، مش غلاف كتيّب.
     ============================================================ */
  :root{
    --pink:#E8467C; --pink-d:#C22A5E;
    --blue:#2563EB; --violet:#7C3AED; --green:#059669;
    --amber:#D97706; --red:#DC2626; --cyan:#0891B2; --indigo:#4F46E5;
    --ink:#1a1f2b; --mut:#6b7280; --line:#e6e9ef; --soft:#f7f8fa;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Cairo',system-ui,sans-serif; color:var(--ink);
    background:#eceef3; line-height:1.9; font-size:15px; padding:24px 12px;
  }
  .page{
    max-width:820px; margin:0 auto; background:#fff; border-radius:20px;
    overflow:hidden; box-shadow:0 10px 40px rgba(20,25,40,.10);
  }

  /* ===== الترويسة ===== */
  .head{ padding:30px 34px 22px; text-align:center; border-bottom:1px solid var(--line); }
  .logo{ font-size:38px; font-weight:900; color:var(--pink-d); letter-spacing:.5px; line-height:1.2; }
  .brs{ font-size:13px; color:var(--mut); margin-top:4px; letter-spacing:.4px; }
  .accent{ width:64px; height:4px; border-radius:99px; margin:16px auto 14px;
           background:linear-gradient(135deg,var(--pink),var(--pink-d)); }
  .head h1{ font-size:19px; font-weight:900; }
  .head p{ font-size:13.5px; color:var(--mut); margin-top:2px; }

  /* ===== التقدّم ===== */
  .prog{ padding:18px 34px 0; }
  .bars{ display:flex; gap:6px; }
  .bars i{ flex:1; height:6px; border-radius:99px; background:#e6e9ef; overflow:hidden; }
  .bars i b{ display:block; height:100%; width:0; border-radius:99px;
             background:linear-gradient(135deg,var(--pink),var(--pink-d));
             transition:width .45s cubic-bezier(.2,.7,.3,1); }
  .progLbl{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--mut); margin-top:8px; }
  .progLbl b{ color:var(--pink-d); font-weight:900; }

  /* ===== الأقسام (من الدليل) ===== */
  .body{ padding:24px 34px 38px; }
  h2{
    font-size:21px; font-weight:900; color:#fff; padding:13px 20px;
    border-radius:14px; display:flex; align-items:center; gap:11px; margin-bottom:16px;
  }
  h2 .ico{ font-size:24px; }
  .h-pink{background:linear-gradient(135deg,#E8467C,#C22A5E)}
  .h-blue{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
  .h-viol{background:linear-gradient(135deg,#8B5CF6,#6D28D9)}
  .h-green{background:linear-gradient(135deg,#10B981,#047857)}
  .h-amber{background:linear-gradient(135deg,#F59E0B,#B45309)}
  .h-red{background:linear-gradient(135deg,#EF4444,#B91C1C)}
  .h-cyan{background:linear-gradient(135deg,#06B6D4,#0E7490)}
  .h-indigo{background:linear-gradient(135deg,#6366F1,#4338CA)}

  .lead{ font-size:15.5px; color:#374151; margin-bottom:14px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0 18px; }
  .stats.s3{ grid-template-columns:repeat(3,1fr); }
  .stat{ border-radius:16px; padding:20px 10px; text-align:center; color:#fff;
         box-shadow:0 6px 16px rgba(20,25,40,.13); }
  .stat .v{ font-size:34px; font-weight:900; line-height:1; }
  .stat .l{ font-size:12.5px; margin-top:8px; opacity:.95; line-height:1.5; font-weight:600; }

  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .card{ border:2px solid var(--line); border-radius:15px; padding:16px 18px; background:var(--soft); }
  .card b{ display:flex; align-items:center; gap:8px; font-size:16px; margin-bottom:6px; }
  .card p{ font-size:14px; color:#374151; }
  .c-ok{ border-color:#6ee7b7; background:linear-gradient(180deg,#ecfdf5,#f8fffc); }
  .c-ok b{ color:#047857; }
  .c-bad{ border-color:#fca5a5; background:linear-gradient(180deg,#fef2f2,#fffafa); }
  .c-bad b{ color:#B91C1C; }
  .c-warn{ border-color:#fcd34d; background:linear-gradient(180deg,#fffbeb,#fffdf7); }
  .c-warn b{ color:#B45309; }
  .c-info{ border-color:#93c5fd; background:linear-gradient(180deg,#eff6ff,#fafcff); }
  .c-info b{ color:#1D4ED8; }
  .full{ grid-column:1 / -1; }

  table{ width:100%; border-collapse:separate; border-spacing:0; margin:14px 0;
         border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(20,25,40,.06); }
  th{ background:#2f3545; color:#fff; padding:13px 16px; text-align:right; font-size:14.5px; font-weight:700; }
  td{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:14.5px; background:#fff; }
  tr:last-child td{ border-bottom:none; }
  tr:nth-child(even) td{ background:#fbfcfd; }
  td.k{ text-align:center; font-weight:800; white-space:nowrap; }
  .up{ color:#047857; } .down{ color:#B91C1C; }
  .num{ unicode-bidi:isolate; direction:ltr; display:inline-block; font-weight:800; }

  .steps{ display:flex; flex-direction:column; gap:11px; margin:14px 0; }
  .stp{ display:flex; gap:14px; align-items:flex-start; background:var(--soft);
        border-radius:14px; padding:14px 16px; border:1px solid var(--line); }
  .stp .n{ flex:0 0 34px; height:34px; border-radius:50%; color:#fff; font-weight:900;
           display:flex; align-items:center; justify-content:center; font-size:16px;
           background:linear-gradient(135deg,#3B82F6,#1D4ED8); }
  .stp b{ font-size:15.5px; display:block; }
  .stp small{ color:var(--mut); font-size:13.5px; display:block; line-height:1.7; }

  .note{ background:linear-gradient(135deg,#1f2430,#2f3545); color:#fff; border-radius:16px;
         padding:20px 24px; font-size:15.5px; margin:16px 0; }
  .note b{ color:#FDE047; }
  .tip{ color:var(--mut); font-size:13.5px; margin-top:8px; }

  /* ===== عناصر النموذج ===== */
  .fade{ animation:fade .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes fade{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);} }
  @media (prefers-reduced-motion:reduce){ .fade{animation:none;} }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:14px; font-weight:800; margin-bottom:7px; }
  .inp{ width:100%; padding:14px 16px; border-radius:14px; border:2px solid var(--line);
        background:#fff; color:var(--ink); font-family:'Cairo'; font-size:16px; font-weight:700; }
  .inp:focus{ outline:none; border-color:var(--pink); }
  .inp.ltr{ direction:ltr; text-align:center; letter-spacing:2px; }
  .msg{ font-size:13.5px; margin-top:6px; font-weight:700; min-height:4px; }
  .msg.ok{ color:#047857; } .msg.err{ color:#B91C1C; }

  .choice{ display:grid; gap:12px; }
  .opt{ border:2px solid var(--line); border-radius:15px; padding:16px; background:var(--soft);
        cursor:pointer; font-weight:900; font-size:17px; text-align:center; transition:all .16s; }
  .opt small{ display:block; font-weight:600; font-size:13px; color:var(--mut); margin-top:3px; }
  .opt.sel{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); color:var(--pink-d);
            box-shadow:0 6px 16px rgba(232,70,124,.16); }
  .g2{ grid-template-columns:1fr 1fr; }
  .days{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .day{ border:2px solid var(--line); border-radius:13px; padding:13px 4px; background:var(--soft);
        cursor:pointer; font-weight:800; font-size:14px; text-align:center; }
  .day.sel{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); color:var(--pink-d); }

  .shot{ display:block; width:100%; border:2px dashed #cfd4e0; border-radius:16px;
         background:var(--soft); padding:26px 18px; text-align:center; cursor:pointer; color:var(--ink); }
  .shot:hover,.shot:focus-visible{ border-color:var(--pink); outline:none; }
  .shot .big{ font-size:34px; display:block; margin-bottom:6px; }
  .shot b{ font-size:16px; }
  .shot small{ display:block; color:var(--mut); font-size:13.5px; margin-top:3px; line-height:1.7; }
  .shot.done{ border-style:solid; border-color:#6ee7b7; padding:10px; background:#fff; }
  .shot img{ width:100%; border-radius:12px; display:block; }
  .shotBar{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin-top:8px; color:var(--mut); }
  .shotBar b{ color:#047857; }
  .retake{ background:none; border:none; color:var(--pink-d); font-size:13.5px; font-weight:800;
           cursor:pointer; font-family:'Cairo'; }
  .sides{ display:flex; gap:9px; margin-bottom:13px; }
  .side{ flex:1; text-align:center; font-size:13.5px; font-weight:800; padding:9px;
         border-radius:12px; border:2px solid var(--line); color:var(--mut); background:var(--soft); }
  .side.on{ border-color:var(--pink); color:var(--pink-d); }
  .side.ok{ border-color:#6ee7b7; color:#047857; }


  .agree{ display:flex; gap:12px; align-items:flex-start; border:2px solid var(--line);
          border-radius:15px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
          font-size:14.5px; font-weight:800; background:var(--soft); line-height:1.75; }
  .agree input{ width:22px; height:22px; accent-color:var(--pink); flex-shrink:0; margin-top:3px; }
  .agree.on{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); }
  .agree small{ display:block; font-weight:500; color:var(--mut); font-size:13px; }

  .nav{ display:flex; gap:11px; margin-top:24px; }
  .btn{ flex:1; padding:16px; border-radius:14px; border:none; font-family:'Cairo';
        font-weight:900; font-size:16.5px; cursor:pointer; }
  .next{ background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:#fff;
         box-shadow:0 6px 16px rgba(232,70,124,.35); }
  .next:disabled{ background:#e3e6ec; color:#a3a8b4; box-shadow:none; cursor:not-allowed; }
  .back{ background:var(--soft); border:1px solid var(--line); color:var(--mut); flex:0 0 88px; font-size:19px; }
  .why{ text-align:center; font-size:14px; color:#B91C1C; font-weight:800; margin-top:11px; min-height:20px; }

  .foot{ text-align:center; padding:18px 26px 26px; color:#9aa0ad; font-size:13px; border-top:1px solid var(--line); }

  @media (max-width:620px){
    body{ padding:0; }
    .page{ border-radius:0; box-shadow:none; }
    .head{ padding:24px 20px 18px; }
    .logo{ font-size:32px; }
    .body{ padding:20px 18px 30px; }
    .prog{ padding:16px 18px 0; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .cards{ grid-template-columns:1fr; }
    h2{ font-size:18px; padding:11px 16px; }
    th,td{ padding:11px 12px; font-size:13.5px; }
  }
</style>
<style>
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chip{ padding:10px 15px; border-radius:999px; border:2px solid var(--line);
         background:var(--soft); cursor:pointer; font-weight:800; font-size:14px; }
  .chip.sel{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); color:var(--pink-d); }
  textarea.inp{ resize:vertical; min-height:88px; line-height:1.8; }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <div class="logo">echarpe</div>
    <div class="brs">الرحاب &nbsp;·&nbsp; مدينتي &nbsp;·&nbsp; سيتي سنتر &nbsp;·&nbsp; Glow</div>
    <div class="accent"></div>
    <h1>التقديم على وظيفة</h1>
    <p>خمس دقائق — ولا يلزم أي مستندات في هذه المرحلة</p>
  </div>

  <div class="prog">
    <div class="bars" id="bars"></div>
    <div class="progLbl"><b id="phName">البداية</b><span id="phNum"></span></div>
  </div>

  <div class="body" id="body"></div>
  <div class="foot">بياناتك تُستخدَم لغرض التوظيف فقط، ولا تُشارَك مع أي جهة أخرى.</div>
</div>
<script>
'use strict';
// ============================================================
// استمارة التقديم على وظيفة — مفتوحة للعامة.
// ⚠️ مرحلة فرز مش توظيف: **مفيش رقم قومي ولا مستندات ولا صور**.
//    المستندات بتتطلب بعدين من رابط الدعوة الخاص بعد المقابلة.
// 🔑 رقم الموبايل = مفتاح المستند. يعني الرقم الواحد = طلب واحد،
//    ولو حد بعت عشر مرات بيتكتب فوق نفسه — مش عشر طلبات في القايمة.
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyCa6Qho3IKoKE_jCNHYuFX6rtaV88jekQs",
  authDomain: "customer-feedback-8ac1d.firebaseapp.com",
  projectId: "customer-feedback-8ac1d",
  storageBucket: "customer-feedback-8ac1d.firebasestorage.app",
  messagingSenderId: "408860081491",
  appId: "1:408860081491:web:c5fa8b8e757c13196375a6"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ALL_BRANCHES = ['الرحاب', 'مدينتي', 'سيتي سنتر', 'Glow'];
const ROLES = {
  sales_social: 'مبيعات ومساعدة تسويق رقمي',
  cashier: 'كاشير ومبيعات',
  setup: 'تجهيز وترتيب الفرع (٧–١٠ ص)'
};
const SHIFTS = {
  morning: '🌅 صباحي — ١٠ ص إلى ٦ م',
  evening: '🌆 مسائي — ٢ م إلى ١٠ م',
  setup:   '✨ تجهيز الفرع — ٧ ص إلى ١٠ ص',
  any:     '🤝 أي شيفت'
};
// 📌 الشواغر — الإدارة بتحدد أي فرع محتاج أي وظيفة، والاستمارة بتعرض
//    المتاح بس. من غير كده المتقدّم بيختار فرع مش محتاج حد.
let OPEN = null;                    // [{branch, role}] — null = لسه بتحمّل
const openBranches = ()=> OPEN ? Array.from(new Set(OPEN.map(function(o){ return o.branch; }))) : [];
const openRolesFor = function(branches){
  if(!OPEN) return [];
  const set = {};
  OPEN.forEach(function(o){
    if(!branches.length || branches.indexOf(o.branch) >= 0) set[o.role] = 1;
  });
  return Object.keys(set);
};
const SOURCES = ['إنستجرام', 'فيسبوك', 'صديق يعمل معكم', 'إعلان في الفرع', 'مكان آخر'];
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const D = { name:'', age:'', phone:'', whatsapp:'', area:'', commute:'',
            roles:[], branches:[], shift:'', workType:'', hoursFrom:'', hoursTo:'',
            startWhen:'', offDays:[],
            studying:'', college:'', classes:'',
            otherJob:'', otherJobWhere:'',
            expRetail:'', expWhere:'', portfolio:'',
            transport:'', notes:'', source:'', ok:{} };

const STEPS = ['welcome','who','avail','exp','extra','review','done'];
const PHASES = [
  { name:'البداية',   steps:['welcome'] },
  { name:'بياناتك',   steps:['who'] },
  { name:'إتاحتك',    steps:['avail'] },
  { name:'خبرتك',     steps:['exp','extra'] },
  { name:'الإرسال',   steps:['review','done'] }
];

let step = 0, SENT = '';
const S = ()=> STEPS[step];
const I = (n)=> STEPS.indexOf(n);
const $ = (s)=> document.querySelector(s);
const esc = (x)=> String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const N = (x)=> '<span class="num">' + x + '</span>';
window.go = (n)=>{ step = Math.max(0, Math.min(STEPS.length-1, n)); render(); window.scrollTo({top:0,behavior:'smooth'}); };
window.set = (k,v)=>{ D[k]=v; render(); };
window.setQ = (k,v)=>{ D[k]=v; sync(); };
window.setOk = (k,v)=>{ D.ok[k]=v; render(); };
window.toggle = function(k, v){
  const a = D[k];
  const i = a.indexOf(v);
  if(i >= 0) a.splice(i, 1); else a.push(v);
  render();
};

const phoneOk = (v)=> /^01[0125]\d{8}$/.test(String(v||'').replace(/\D/g,''));

const BLOCK = {
  who: ()=>{
    if(D.name.trim().split(/\s+/).length < 2) return 'يُرجى كتابة الاسم واللقب على الأقل';
    const a = Number(D.age);
    if(!a || a < 16 || a > 70) return 'يُرجى كتابة السن (من ١٦ إلى ٧٠)';
    if(!phoneOk(D.phone)) return 'رقم الهاتف ١١ رقمًا ويبدأ بـ ٠١٠ أو ٠١١ أو ٠١٢ أو ٠١٥';
    if(D.whatsapp && !phoneOk(D.whatsapp)) return 'رقم واتساب غير صحيح — أو يُترك فارغًا';
    if(D.area.trim().length < 3) return 'يُرجى كتابة المنطقة التي تسكن فيها';
    return '';
  },
  avail: ()=>{
    if(!D.branches.length) return 'يُرجى اختيار فرع واحد على الأقل';
    if(!D.roles.length) return 'يُرجى اختيار وظيفة واحدة على الأقل';
    if(!D.commute) return 'يُرجى تحديد مدة الوصول إلى الفرع الذي اخترته';
    if(!D.shift) return 'يُرجى تحديد الشيفت المفضَّل';
    if(!D.workType) return 'يُرجى تحديد نوع الدوام';
    if(!D.startWhen) return 'يُرجى تحديد موعد الاستعداد للبدء';
    return '';
  },
  exp: ()=>{
    if(!D.expRetail) return 'يُرجى تحديد إن كانت لديك خبرة سابقة';
    if(D.expRetail === 'yes' && D.expWhere.trim().length < 3) return 'يُرجى ذكر مكان العمل السابق ومدته';
    return '';
  },
  extra: ()=>{
    if(!D.studying) return 'يُرجى تحديد إن كنت تدرس حاليًا';
    if(D.studying === 'yes' && D.college.trim().length < 3) return 'يُرجى ذكر الكلية';
    if(!D.otherJob) return 'يُرجى تحديد إن كنت تعمل في مكان آخر حاليًا';
    if(D.otherJob === 'yes' && D.otherJobWhere.trim().length < 3) return 'يُرجى ذكر مكان العمل الحالي ومواعيده';
    if(!D.transport) return 'يُرجى تحديد وسيلة المواصلات';
    if(!D.source) return 'يُرجى تحديد كيف عرفت عنا';
    return '';
  },
  review: ()=> D.ok.truth ? '' : 'يلزم الإقرار بصحة البيانات'
};
function sync(){
  const b = $('.next'), w = $('.why'); if(!b) return;
  const f = BLOCK[S()], why = f ? f() : '';
  b.disabled = !!why;
  if(w) w.textContent = why;
}
function nav(back, next, txt){
  return `<div class="nav">
    ${back != null ? `<button class="btn back" onclick="go(${back})">◀</button>` : ''}
    <button class="btn next" onclick="go(${next})">${txt || 'التالي ▶'}</button>
  </div><div class="why"></div>`;
}
const chips = (key, list, multi)=> `<div class="chips">` + list.map(function(o){
  const v = o.v != null ? o.v : o, l = o.l != null ? o.l : o;
  const on = multi ? (D[key].indexOf(v) >= 0) : (D[key] === v);
  const act = multi ? `toggle('${key}','${esc(v)}')` : `set('${key}','${esc(v)}')`;
  return `<div class="chip ${on?'sel':''}" onclick="${act}">${esc(l)}</div>`;
}).join('') + `</div>`;

const V = {};

V.welcome = ()=> `<div class="fade">
  <h2 class="h-pink"><span class="ico">💼</span> فرص العمل</h2>
  <p class="lead">نبحث عن زميلات وزملاء للعمل في فروع echarpe و Glow.
    الاستمارة تستغرق نحو خمس دقائق، ولا تحتاج أي مستندات في هذه المرحلة.</p>
  <div class="steps">

// 📤 الإرسال — رقم الموبايل هو مفتاح المستند
async function submitApp(btn){
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  const phone = String(D.phone).replace(/\D/g, '');
  try{
    await firebase.auth().signInAnonymously();
    const ref = db.collection('job_applications').doc(phone);
    // 🚫 مفيش تقديم تاني قبل ٣٠ يوم — بيمنع التكرار من غير ما يمنع
    //    اللي غيّر ظروفه فعلًا
    const cur = await ref.get();
    if(cur.exists){
      const at = Number((cur.data() || {}).ts) || 0;
      const days = Math.floor((Date.now() - at) / 86400000);
      if(days < 30){
        btn.disabled = false; btn.textContent = 'إرسال الطلب';
        const w = $('.why');
        if(w) w.textContent = 'سبق التقديم بهذا الرقم منذ ' + days + ' يومًا — يمكن إعادة التقديم بعد ٣٠ يومًا';
        return;
      }
    }
    await ref.set({
      phone: phone, whatsapp: String(D.whatsapp || D.phone).replace(/\D/g, ''),
      name: D.name.trim(), age: Number(D.age) || 0,
      area: D.area.trim(), commute: D.commute,
      roles: D.roles, branches: D.branches, shift: D.shift,
      startWhen: D.startWhen, offDays: D.offDays,
      studying: D.studying === 'yes', college: D.college.trim(), classes: D.classes.trim(),
      expRetail: D.expRetail === 'yes', expWhere: D.expWhere.trim(),
      portfolio: D.portfolio.trim(),
      workType: D.workType, hoursFrom: D.hoursFrom.trim(), hoursTo: D.hoursTo.trim(),
      otherJob: D.otherJob === 'yes', otherJobWhere: D.otherJobWhere.trim(),
      transport: D.transport, source: D.source, notes: D.notes.trim(),
      status: 'new', ts: Date.now()
    });
    SENT = phone.slice(-6);
    go(I('done'));
  }catch(e){
    btn.disabled = false; btn.textContent = 'إرسال الطلب';
    const w = $('.why');
    if(w) w.textContent = 'تعذّر الإرسال: ' + (e.code || e.message);
  }
}
window.submitApp = submitApp;

// 📌 تحميل الشواغر — لو مفيش شواغر، الاستمارة مبتفتحش أصلًا
async function loadOpenings(){
  try{
    await firebase.auth().signInAnonymously();
    const d = await db.collection('pos_test_settings').doc('job_openings').get();
    const raw = (d.exists && Array.isArray((d.data() || {}).list)) ? d.data().list : [];
    OPEN = raw.filter(function(o){ return o && o.branch && ROLES[o.role]; });
  }catch(e){ OPEN = []; }
  if(!OPEN.length){
    document.getElementById('body').innerHTML =
      '<div class="fade"><h2 class="h-amber"><span class="ico">🔕</span> لا توجد شواغر حاليًا</h2>'
      + '<p class="lead">لا توجد وظائف متاحة في الوقت الحالي. تابع صفحاتنا على وسائل '
      + 'التواصل — نعلن عن الشواغر فور توفرها.</p></div>';
    return;
  }
  render();
}

function render(){
  const cur = S(), pi = PHASES.findIndex(p=> p.steps.indexOf(cur) >= 0);
  $('#bars').innerHTML = PHASES.map(function(p,i){
    const w = i < pi ? 100 : (i > pi ? 0 : Math.round(((p.steps.indexOf(cur)+1)/p.steps.length)*100));
    return `<i><b style="width:${w}%"></b></i>`;
  }).join('');
  $('#phName').textContent = PHASES[pi].name;
  $('#phNum').textContent = (pi+1) + ' من ' + PHASES.length;
  $('#body').innerHTML = V[cur]();
  sync();
  const f = document.querySelector('[data-focus]');
  if(f) setTimeout(function(){ try{ f.focus(); }catch(e){} }, 130);
}
loadOpenings();
</script>
