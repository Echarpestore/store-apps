<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>echarpe — إيشارب</title>
<meta name="description" content="echarpe — طرح لينن وشيفون كويتي. جرّبي أي قطعة عليكِ، واطلبي من الشات، واستلمي من الفرع أو لحد البيت.">
<meta property="og:title" content="echarpe — إيشارب">
<meta property="og:description" content="جرّبي المجموعة عليكِ واطلبي طرحتك من الشات 🤍">
<meta property="og:image" content="https://www.echarpe.store/atelier/collection/hero-comfort.jpg">
<link rel="canonical" href="https://www.echarpe.store/atelier/">
<link rel="icon" href="loyalty/icon-192.png">
<!-- 🏠 الصفحة الرئيسية = الأتيليه. العربي هو الافتراضي للي داخلة من الدومين
     (إلا لو اختارت لغة قبل كده أو اللينك فيه lang). الباراميترز والـ# بيتنقلوا زي ما هم. -->
<script>
(function(){
  var q = location.search, saved = '';
  try{ saved = localStorage.getItem('atelier_lang') || ''; }catch(e){}
  if(!/[?&]lang=(en|ar)(&|$)/.test(q) && saved !== 'en' && saved !== 'ar') q += (q ? '&' : '?') + 'lang=ar';
  location.replace('atelier/' + q + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=atelier/?lang=ar"></noscript>
<style>body{margin:0; min-height:100vh; display:grid; place-items:center; background:#fff; font-family:system-ui,sans-serif;} img{width:min(56vw,240px);} a{display:block; margin-top:18px; text-align:center; color:#191715;}</style>
</head>
<body>
<div><img src="logo.png" alt="echarpe"><a href="atelier/?lang=ar">ادخلي المتجر</a></div>
</body>
</html>
