<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>echarpe ✿ جرّبي الطرحة</title>
<meta name="theme-color" content="#FFF6FA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://storage.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#E6B450; --gold-deep:#C79A38;
    --bg:#FFF6FA; --ink:#3A2233; --muted:#9E8792; --line:#F3DEE9;
  }
  *{margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--ink); overscroll-behavior:none;
  }
  .app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh;
       display:flex; flex-direction:column;}
  header{display:flex; align-items:center; justify-content:space-between;
         padding:14px 16px 8px;}
  header .brand{font-weight:800; font-size:20px;}
  header .brand span{color:var(--gold-deep);}
  header .priv{font-size:11px; color:var(--muted); text-align:left; line-height:1.5;}

  .stageWrap{position:relative; margin:6px 12px; border-radius:22px;
             overflow:hidden; background:#111; aspect-ratio:3/4;
             box-shadow:0 10px 30px rgba(58,34,51,.12);}
  #stage{width:100%; height:100%; object-fit:cover; display:block;}
  #stage.mirror{transform:scaleX(-1);}
  #stage3d{position:absolute; inset:0; width:100%; height:100%;
           pointer-events:none;}
  #stage3d.mirror{transform:scaleX(-1);}
  #cam{display:none;}

  #hint{position:absolute; top:14px; right:50%; transform:translateX(50%);
        background:rgba(58,34,51,.82); color:#fff; padding:8px 16px;
        border-radius:99px; font-size:14px; font-weight:700; opacity:0;
        transition:opacity .25s; pointer-events:none; white-space:nowrap;}
  #hint.show{opacity:1;}

  #loader{position:absolute; inset:0; display:flex; flex-direction:column;
          gap:12px; align-items:center; justify-content:center;
          background:rgba(20,12,18,.75); color:#fff; z-index:5;}
  #loader .spin{width:38px; height:38px; border-radius:50%;
          border:3px solid rgba(255,255,255,.25); border-top-color:var(--gold);
          animation:sp 1s linear infinite;}
  @keyframes sp{to{transform:rotate(360deg);}}
  #loader p{font-size:14px; font-weight:500;}

  #fatal{display:none; margin:10px 16px; padding:14px 16px; border-radius:14px;
         background:#FCE9EC; color:#8A3B4C; font-size:14px; line-height:1.8;}

  .panel{padding:8px 16px 4px;}
  .panel .lbl{font-size:13px; color:var(--muted); margin-bottom:6px;}
  .panel .lbl b{color:var(--ink);}
  #colors{display:flex; gap:10px; overflow-x:auto; padding:4px 2px 8px;
          scrollbar-width:none;}
  #colors::-webkit-scrollbar{display:none;}
  .sw{min-width:38px; height:38px; border-radius:50%; border:3px solid #fff;
      box-shadow:0 0 0 1.5px var(--line); flex:0 0 auto; transition:transform .15s;}
  .sw.on{box-shadow:0 0 0 2.5px var(--gold-deep); transform:scale(1.12);}

  .actions{display:flex; align-items:center; justify-content:center; gap:18px;
           padding:8px 16px calc(18px + env(safe-area-inset-bottom));}
  .actions button{border:none; background:#fff; color:var(--ink);
      border-radius:99px; padding:12px 18px; font-weight:700; font-size:14px;
      box-shadow:0 4px 14px rgba(58,34,51,.10); display:flex; gap:6px;
      align-items:center;}
  .actions button.on{background:var(--ink); color:#fff;}
  #btnShot{width:72px; height:72px; border-radius:50%; padding:0;
      background:linear-gradient(135deg,var(--gold),var(--gold-deep));
      color:#fff; font-size:28px; box-shadow:0 6px 20px rgba(199,154,56,.45);
      justify-content:center;}
  #btnShot:active{transform:scale(.93);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">echarpe <span>✿</span></div>
    <div class="priv">🔒 الصورة بتتعالج على موبايلك بس<br>ولا حاجة بتترفع لأي سيرفر</div>
  </header>

  <div class="stageWrap">
    <video id="cam" playsinline muted></video>
    <canvas id="stage" class="mirror"></canvas>
    <canvas id="stage3d" class="mirror"></canvas>
    <div id="hint"></div>
    <div id="loader"><div class="spin"></div><p>ثواني…</p></div>
  </div>

  <div id="fatal"></div>

  <div class="actions">
    <button id="btnPhoto">📷 على صورة</button>
    <button id="btnShot" title="التقاط">✦</button>
    <button id="btnLive" class="on">🎥 لايف</button>
  </div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">
</div>

<script src="assets/catalog.js"></script>
<script src="tryon-core.js"></script>
<script src="recolor-core.js"></script>
<script src="tryon-3d-core.js"></script>
<script src="tryon-3d.js"></script>
<script src="tryon-app.js"></script>
<script>
  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
