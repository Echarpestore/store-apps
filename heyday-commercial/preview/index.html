<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HEYDAY Preview</title>
<style>
  :root { --bg:#0B0F17; --fg:#FAF8F4; --gold:#C9A465; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 Inter, system-ui, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; gap:14px; min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  h1 { font-weight:500; font-size:18px; letter-spacing:.08em; margin:0; }
  .row { display:flex; gap:8px; }
  button { background:transparent; color:var(--fg); border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:8px 14px; cursor:pointer; font:inherit; }
  button.on, button:hover { border-color:var(--gold); color:var(--gold); }
  .stage { margin:0 auto; width:100%; }
  .stage.v { aspect-ratio: 9/16; max-width: min(100%, calc((100vh - 170px) * 9 / 16)); }
  .stage.h { aspect-ratio: 16/9; }
  nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  nav b { color:var(--gold); font-weight:600; margin-right:4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="./dist/main.js"></script>
</body>
</html>
