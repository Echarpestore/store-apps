<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استمارة التسجيل — echarpe · Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
  /* ============================================================
     نفس متغيرات وكلاسات دليل الموظفة.
     الفرق الوحيد: الترويسة بيضاء هادية بدل الغلاف الوردي الكبير —
     ده نموذج بيتملى، مش غلاف كتيّب.
     ============================================================ */
  :root{
    --pink:#E8467C; --pink-d:#C22A5E;
    --blue:#2563EB; --violet:#7C3AED; --green:#059669;
    --amber:#D97706; --red:#DC2626; --cyan:#0891B2; --indigo:#4F46E5;
    --ink:#1a1f2b; --mut:#6b7280; --line:#e6e9ef; --soft:#f7f8fa;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body{
    font-family:'Cairo',system-ui,sans-serif; color:var(--ink);
    background:#eceef3; line-height:1.9; font-size:15px; padding:24px 12px;
  }
  .page{
    max-width:820px; margin:0 auto; background:#fff; border-radius:20px;
    overflow:hidden; box-shadow:0 10px 40px rgba(20,25,40,.10);
  }

  /* ===== الترويسة ===== */
  .head{ padding:30px 34px 22px; text-align:center; border-bottom:1px solid var(--line); }
  .logo{ font-size:38px; font-weight:900; color:var(--pink-d); letter-spacing:.5px; line-height:1.2; }
  .brs{ font-size:13px; color:var(--mut); margin-top:4px; letter-spacing:.4px; }
  .accent{ width:64px; height:4px; border-radius:99px; margin:16px auto 14px;
           background:linear-gradient(135deg,var(--pink),var(--pink-d)); }
  .head h1{ font-size:19px; font-weight:900; }
  .head p{ font-size:13.5px; color:var(--mut); margin-top:2px; }

  /* ===== التقدّم ===== */
  .prog{ padding:18px 34px 0; }
  .bars{ display:flex; gap:6px; }
  .bars i{ flex:1; height:6px; border-radius:99px; background:#e6e9ef; overflow:hidden; }
  .bars i b{ display:block; height:100%; width:0; border-radius:99px;
             background:linear-gradient(135deg,var(--pink),var(--pink-d));
             transition:width .45s cubic-bezier(.2,.7,.3,1); }
  .progLbl{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--mut); margin-top:8px; }
  .progLbl b{ color:var(--pink-d); font-weight:900; }

  /* ===== الأقسام (من الدليل) ===== */
  .body{ padding:24px 34px 38px; }
  h2{
    font-size:21px; font-weight:900; color:#fff; padding:13px 20px;
    border-radius:14px; display:flex; align-items:center; gap:11px; margin-bottom:16px;
  }
  h2 .ico{ font-size:24px; }
  .h-pink{background:linear-gradient(135deg,#E8467C,#C22A5E)}
  .h-blue{background:linear-gradient(135deg,#3B82F6,#1D4ED8)}
  .h-viol{background:linear-gradient(135deg,#8B5CF6,#6D28D9)}
  .h-green{background:linear-gradient(135deg,#10B981,#047857)}
  .h-amber{background:linear-gradient(135deg,#F59E0B,#B45309)}
  .h-red{background:linear-gradient(135deg,#EF4444,#B91C1C)}
  .h-cyan{background:linear-gradient(135deg,#06B6D4,#0E7490)}
  .h-indigo{background:linear-gradient(135deg,#6366F1,#4338CA)}

  .lead{ font-size:15.5px; color:#374151; margin-bottom:14px; }

  .stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:16px 0 18px; }
  .stats.s3{ grid-template-columns:repeat(3,1fr); }
  .stat{ border-radius:16px; padding:20px 10px; text-align:center; color:#fff;
         box-shadow:0 6px 16px rgba(20,25,40,.13); }
  .stat .v{ font-size:34px; font-weight:900; line-height:1; }
  .stat .l{ font-size:12.5px; margin-top:8px; opacity:.95; line-height:1.5; font-weight:600; }

  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:13px; }
  .card{ border:2px solid var(--line); border-radius:15px; padding:16px 18px; background:var(--soft); }
  .card b{ display:flex; align-items:center; gap:8px; font-size:16px; margin-bottom:6px; }
  .card p{ font-size:14px; color:#374151; }
  .c-ok{ border-color:#6ee7b7; background:linear-gradient(180deg,#ecfdf5,#f8fffc); }
  .c-ok b{ color:#047857; }
  .c-bad{ border-color:#fca5a5; background:linear-gradient(180deg,#fef2f2,#fffafa); }
  .c-bad b{ color:#B91C1C; }
  .c-warn{ border-color:#fcd34d; background:linear-gradient(180deg,#fffbeb,#fffdf7); }
  .c-warn b{ color:#B45309; }
  .c-info{ border-color:#93c5fd; background:linear-gradient(180deg,#eff6ff,#fafcff); }
  .c-info b{ color:#1D4ED8; }
  .full{ grid-column:1 / -1; }

  table{ width:100%; border-collapse:separate; border-spacing:0; margin:14px 0;
         border-radius:14px; overflow:hidden; box-shadow:0 2px 10px rgba(20,25,40,.06); }
  th{ background:#2f3545; color:#fff; padding:13px 16px; text-align:right; font-size:14.5px; font-weight:700; }
  td{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:14.5px; background:#fff; }
  tr:last-child td{ border-bottom:none; }
  tr:nth-child(even) td{ background:#fbfcfd; }
  td.k{ text-align:center; font-weight:800; white-space:nowrap; }
  .up{ color:#047857; } .down{ color:#B91C1C; }
  .num{ unicode-bidi:isolate; direction:ltr; display:inline-block; font-weight:800; }

  .steps{ display:flex; flex-direction:column; gap:11px; margin:14px 0; }
  .stp{ display:flex; gap:14px; align-items:flex-start; background:var(--soft);
        border-radius:14px; padding:14px 16px; border:1px solid var(--line); }
  .stp .n{ flex:0 0 34px; height:34px; border-radius:50%; color:#fff; font-weight:900;
           display:flex; align-items:center; justify-content:center; font-size:16px;
           background:linear-gradient(135deg,#3B82F6,#1D4ED8); }
  .stp b{ font-size:15.5px; display:block; }
  .stp small{ color:var(--mut); font-size:13.5px; display:block; line-height:1.7; }

  .note{ background:linear-gradient(135deg,#1f2430,#2f3545); color:#fff; border-radius:16px;
         padding:20px 24px; font-size:15.5px; margin:16px 0; }
  .note b{ color:#FDE047; }
  .tip{ color:var(--mut); font-size:13.5px; margin-top:8px; }

  /* ===== عناصر النموذج ===== */
  .fade{ animation:fade .4s cubic-bezier(.2,.7,.3,1); }
  @keyframes fade{ from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);} }
  @media (prefers-reduced-motion:reduce){ .fade{animation:none;} }

  .field{ margin-bottom:15px; }
  .field label{ display:block; font-size:14px; font-weight:800; margin-bottom:7px; }
  .inp{ width:100%; padding:14px 16px; border-radius:14px; border:2px solid var(--line);
        background:#fff; color:var(--ink); font-family:'Cairo'; font-size:16px; font-weight:700; }
  .inp:focus{ outline:none; border-color:var(--pink); }
  .inp.ltr{ direction:ltr; text-align:center; letter-spacing:2px; }
  .msg{ font-size:13.5px; margin-top:6px; font-weight:700; min-height:4px; }
  .msg.ok{ color:#047857; } .msg.err{ color:#B91C1C; }

  .choice{ display:grid; gap:12px; }
  .opt{ border:2px solid var(--line); border-radius:15px; padding:16px; background:var(--soft);
        cursor:pointer; font-weight:900; font-size:17px; text-align:center; transition:all .16s; }
  .opt small{ display:block; font-weight:600; font-size:13px; color:var(--mut); margin-top:3px; }
  .opt.sel{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); color:var(--pink-d);
            box-shadow:0 6px 16px rgba(232,70,124,.16); }
  .g2{ grid-template-columns:1fr 1fr; }
  .days{ display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  .day{ border:2px solid var(--line); border-radius:13px; padding:13px 4px; background:var(--soft);
        cursor:pointer; font-weight:800; font-size:14px; text-align:center; }
  .day.sel{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); color:var(--pink-d); }

  .shot{ display:block; width:100%; border:2px dashed #cfd4e0; border-radius:16px;
         background:var(--soft); padding:26px 18px; text-align:center; cursor:pointer; color:var(--ink); }
  .shot:hover,.shot:focus-visible{ border-color:var(--pink); outline:none; }
  .shot .big{ font-size:34px; display:block; margin-bottom:6px; }
  .shot b{ font-size:16px; }
  .shot small{ display:block; color:var(--mut); font-size:13.5px; margin-top:3px; line-height:1.7; }
  .shot.done{ border-style:solid; border-color:#6ee7b7; padding:10px; background:#fff; }
  .shot img{ width:100%; border-radius:12px; display:block; }
  .shotBar{ display:flex; justify-content:space-between; align-items:center; font-size:13.5px; margin-top:8px; color:var(--mut); }
  .shotBar b{ color:#047857; }
  .retake{ background:none; border:none; color:var(--pink-d); font-size:13.5px; font-weight:800;
           cursor:pointer; font-family:'Cairo'; }
  .sides{ display:flex; gap:9px; margin-bottom:13px; }
  .side{ flex:1; text-align:center; font-size:13.5px; font-weight:800; padding:9px;
         border-radius:12px; border:2px solid var(--line); color:var(--mut); background:var(--soft); }
  .side.on{ border-color:var(--pink); color:var(--pink-d); }
  .side.ok{ border-color:#6ee7b7; color:#047857; }

  #sigPad{ width:100%; height:180px; border-radius:15px; border:2px solid var(--line);
           background:#fff; touch-action:none; display:block; }

  .agree{ display:flex; gap:12px; align-items:flex-start; border:2px solid var(--line);
          border-radius:15px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
          font-size:14.5px; font-weight:800; background:var(--soft); line-height:1.75; }
  .agree input{ width:22px; height:22px; accent-color:var(--pink); flex-shrink:0; margin-top:3px; }
  .agree.on{ border-color:var(--pink); background:linear-gradient(180deg,#fff0f5,#fffafc); }
  .agree small{ display:block; font-weight:500; color:var(--mut); font-size:13px; }

  .nav{ display:flex; gap:11px; margin-top:24px; }
  .btn{ flex:1; padding:16px; border-radius:14px; border:none; font-family:'Cairo';
        font-weight:900; font-size:16.5px; cursor:pointer; }
  .next{ background:linear-gradient(135deg,var(--pink),var(--pink-d)); color:#fff;
         box-shadow:0 6px 16px rgba(232,70,124,.35); }
  .next:disabled{ background:#e3e6ec; color:#a3a8b4; box-shadow:none; cursor:not-allowed; }
  .back{ background:var(--soft); border:1px solid var(--line); color:var(--mut); flex:0 0 88px; font-size:19px; }
  .why{ text-align:center; font-size:14px; color:#B91C1C; font-weight:800; margin-top:11px; min-height:20px; }

  .foot{ text-align:center; padding:18px 26px 26px; color:#9aa0ad; font-size:13px; border-top:1px solid var(--line); }

  @media (max-width:620px){
    body{ padding:0; }
    .page{ border-radius:0; box-shadow:none; }
    .head{ padding:24px 20px 18px; }
    .logo{ font-size:32px; }
    .body{ padding:20px 18px 30px; }
    .prog{ padding:16px 18px 0; }
    .stats{ grid-template-columns:repeat(2,1fr); }
    .cards{ grid-template-columns:1fr; }
    h2{ font-size:18px; padding:11px 16px; }
    th,td{ padding:11px 12px; font-size:13.5px; }
  }
</style>
</head>

<!-- 🔐 بوابة الدعوة: الصفحة نفسها مبتظهرش غير لما الكود يتأكد -->
<div class="page" id="gate">
  <div class="head">
    <div class="logo">echarpe</div>
    <div class="brs">الرحاب &nbsp;·&nbsp; مدينتي &nbsp;·&nbsp; سيتي سنتر &nbsp;·&nbsp; Glow</div>
    <div class="accent"></div>
    <h1 id="gateTitle">جارٍ التحقق من الدعوة…</h1>
    <p id="gateMsg">لحظة من فضلك</p>

<div class="page" id="page" style="display:none;">
  <div class="head">
    <div class="logo" id="logo">echarpe</div>
    <div class="brs" id="brs">الرحاب &nbsp;·&nbsp; مدينتي &nbsp;·&nbsp; سيتي سنتر &nbsp;·&nbsp; Glow</div>
    <div class="accent"></div>
    <h1>استمارة التسجيل في الفريق</h1>

  </div>

  <div class="prog">

  </div>

  <div class="body" id="body"></div>
  <div class="foot">الأرقام الواردة في هذه الاستمارة هي السارية وقت التسجيل، وأي تعديل يُبلَّغ قبل تطبيقه.</div>
</div>

<script>
'use strict';
// ============================================================
// معاينة استمارة التسجيل الخارجية — تعمل بالكامل محليًا بلا حفظ.
// في النسخة النهائية: الفروع من sales_branch_list · الإرسال إلى
// sales_registrations · كل صورة في مستند مستقل.
// ============================================================

// 🏬 echarpe هي صاحبة الفروع · Glow محل واحد
const ECHARPE_BRANCHES = ['الرحاب', 'مدينتي', 'سيتي سنتر'];

const ROLES = {
  sales_social: {
    label:'Sales & Social Media Assistant', ar:'مبيعات ومساعدة تسويق رقمي',
    hours:8, trialDays:30,
    duties:[
      'بيع الطرح والإكسسوارات داخل الفرع',
      'مساعدة العميلات في اختيار المنتجات',
      'الرد على رسائل واتساب وإنستجرام',
      'تصوير المنتجات',
      'تصوير الفيديوهات والريلز والستوريز',
      'مونتاج الصور والفيديوهات — CapCut أو Canva',
      'المساهمة في إعداد محتوى وسائل التواصل ونشره'
    ]
  },
  cashier: {
    label:'Cashier / Sales', ar:'كاشير ومبيعات', hours:8, trialDays:30,
    duties:[
      'بيع الطرح والإكسسوارات داخل الفرع',
      'مساعدة العميلات في اختيار المنتجات',
      'تشغيل الكاشير وتحصيل الفواتير',
      'ترتيب المعروض ومتابعة النواقص'
    ]
  }
};

const GOV = {'01':'القاهرة','02':'الإسكندرية','03':'بورسعيد','04':'السويس','11':'دمياط','12':'الدقهلية','13':'الشرقية','14':'القليوبية','15':'كفر الشيخ','16':'الغربية','17':'المنوفية','18':'البحيرة','19':'الإسماعيلية','21':'الجيزة','22':'بني سويف','23':'الفيوم','24':'المنيا','25':'أسيوط','26':'سوهاج','27':'قنا','28':'أسوان','29':'الأقصر','31':'البحر الأحمر','32':'الوادي الجديد','33':'مطروح','34':'شمال سيناء','35':'جنوب سيناء','88':'خارج الجمهورية'};
const DAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const SHIFTS = {
  morning:{ label:'الشيفت الصباحي', from:'10:00', fromM:'ص', to:'6:00',  toM:'م', raw24from:'10:00', raw24to:'18:00' },
  evening:{ label:'الشيفت المسائي', from:'2:00',  fromM:'م', to:'10:00', toM:'م', raw24from:'14:00', raw24to:'22:00' }
};
const TC = { lateMinPerHour:10, breakMin:30, breakGrace:5, breakPerHour:10,
             swapHours:4, hoursPerDay:7, monthCap:7, weekCap:2 };

const D = { brand:'', branch:'', role:'', name:'', gender:'', phone:'', whatsapp:'', nid:'',
            emgName:'', emgRel:'', emgPhone:'', address:'', eduType:'', shift:'', dayOff:'',
            pin:'', pin2:'', sig:'', docs:{}, ok:{} };

// 🔐 البراند والفرع والوظيفة بيجوا **من الدعوة** — مش اختيار.
//    فمفيش فرصة إن الموظفة تسجّل نفسها في فرع تاني أو وظيفة تانية،
//    والاستمارة بتقصر ٣ خطوات.
const STEPS = ['welcome','duties','trial','name','id','emergency',
               'idcard','edu','address','system','shift','pin','sign','review','done'];
const PHASES = [
  { name:'البداية',        steps:['welcome'] },
  { name:'الوظيفة',        steps:['duties','trial'] },
  { name:'البيانات',       steps:['name','id','emergency'] },
  { name:'المستندات',      steps:['idcard','edu','address'] },
  { name:'نظام العمل',     steps:['system','shift','pin'] },
  { name:'الإقرار',        steps:['sign','review','done'] }
];

let step = 0;
const S = ()=> STEPS[step];
const I = (n)=> STEPS.indexOf(n);
const $ = (s)=> document.querySelector(s);
const esc = (x)=> String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const N = (x)=> '<span class="num">' + x + '</span>';

window.go = (n)=>{ step = Math.max(0, Math.min(STEPS.length-1, n)); render(); window.scrollTo({top:0,behavior:'smooth'}); };
window.set = (k,v)=>{ D[k]=v; render(); };
window.setQ = (k,v)=>{ D[k]=v; sync(); };
window.setOk = (k,v)=>{ D.ok[k]=v; render(); };


// ---------- التحقق ----------
function readNID(v){
  const s = String(v||'').replace(/\D/g,'');
  if(!s) return { ok:false, why:'' };
  if(s.length !== 14) return { ok:false, why:'الرقم القومي ١٤ رقمًا — المُدخَل ' + s.length };
  const c = s[0];
  if(c !== '2' && c !== '3') return { ok:false, why:'الرقم الأول يجب أن يكون ٢ أو ٣' };
  const yy = +s.slice(1,3), mm = +s.slice(3,5), dd = +s.slice(5,7);
  const year = (c === '2' ? 1900 : 2000) + yy;
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return { ok:false, why:'تاريخ الميلاد داخل الرقم غير صحيح' };
  const dt = new Date(Date.UTC(year, mm-1, dd));
  if(dt.getUTCMonth() !== mm-1 || dt.getUTCDate() !== dd) return { ok:false, why:'تاريخ الميلاد داخل الرقم غير موجود' };
  const gov = GOV[s.slice(7,9)];
  if(!gov) return { ok:false, why:'كود المحافظة داخل الرقم غير معروف' };
  const age = Math.floor((Date.now() - dt.getTime()) / (365.25*864e5));
  if(age < 18) return { ok:false, why:'التسجيل من سن ١٨ سنة فأكثر' };
  return { ok:true, birth: year+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0'),
           gov, age, gender:(+s[12] % 2) ? 'male' : 'female' };
}
const phoneOk = (v)=> /^01[0125]\d{8}$/.test(String(v||'').replace(/\D/g,''));

// 🔴 كل خطوة تُرجع **سبب** المنع نصًّا. قبل ذلك كان الزر يُقفَل رماديًا
//    بلا تفسير، فتقف المتقدِّمة دون معرفة الناقص.
const BLOCK = {
  trial:  ()=> D.ok.trial ? '' : 'يُرجى التأشير على الإقرار بمدة فترة الاختبار',
  name:   ()=>{
    if(D.name.trim().length < 3) return 'يُرجى كتابة الاسم';
    if(D.name.trim().split(/\s+/).length < 2) return 'يُرجى كتابة الاسم واللقب على الأقل، كما في البطاقة';
    if(!phoneOk(D.phone)) return 'رقم الهاتف ١١ رقمًا ويبدأ بـ ٠١٠ أو ٠١١ أو ٠١٢ أو ٠١٥';
    if(D.whatsapp && !phoneOk(D.whatsapp)) return 'رقم واتساب غير صحيح — أو يُترك فارغًا';
    return '';
  },
  id: ()=>{
    const r = readNID(D.nid);
    if(!r.ok) return r.why || 'يُرجى إدخال الرقم القومي';
    if(!D.gender) return 'يُرجى تحديد النوع';
    if(r.gender !== D.gender) return 'النوع المحدَّد يخالف الوارد في الرقم القومي — يُرجى المراجعة';
    return '';
  },
  emergency: ()=>{
    if(D.emgName.trim().length < 3) return 'يُرجى كتابة الاسم';
    if(!D.emgRel.trim()) return 'يُرجى كتابة صلة القرابة';

window.nidLive = function(el){

  D.nid = v;

    else { m.textContent = r.why; m.className = 'msg err'; }

  sync();
};
window.pinLive = function(el, key){
  const v = String(el.value||'').replace(/\D/g,'');
  if(el.value !== v) el.value = v;
  D[key] = v;
  const m = $('#pinMsg');
  if(m) m.textContent = (/^\d{4}$/.test(D.pin) && D.pin === D.pin2) ? '✅ متطابقان' : '';
  sync();
};

// ---------- الصور ----------
function compress(file, maxW, q){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h*(maxW/w)); w = maxW; }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = ()=> rej(new Error('تعذّرت قراءة الصورة'));
      img.src = e.target.result;
    };
    r.onerror = ()=> rej(new Error('تعذّرت قراءة الملف'));
    r.readAsDataURL(file);
  });
}
const kb = (d)=> Math.round((String(d).length*3/4)/1024);
window.pickDoc = function(key, input){
  const f = input.files && input.files[0]; if(!f) return;
  compress(f, 1400, .62).then(d=>{ D.docs[key] = { data:d, size:kb(d) }; render(); })
    .catch(e=> alert(e.message));
};
window.dropDoc = function(key){ delete D.docs[key]; render(); };

function shot(key, title, note){
  const g = D.docs[key];
  if(g) return `<div class="shot done"><img src="${g.data}" alt="">
    <div class="shotBar"><b>✅ ${esc(title)} · ${N(g.size)} كيلوبايت</b>
    <button class="retake" onclick="dropDoc('${key}')">إعادة التصوير</button></div></div>`;
  return `<label class="shot" tabindex="0"><span class="big">📷</span><b>${esc(title)}</b>
    <small>${esc(note||'')}</small>
    <input type="file" accept="image/*" capture="environment" hidden onchange="pickDoc('${key}',this)"></label>`;
}
function nav(back, next, txt){
  return `<div class="nav">
    ${back != null ? `<button class="btn back" onclick="go(${back})">◀</button>` : ''}
    <button class="btn next" onclick="go(${next})">${txt || 'التالي ▶'}</button>
  </div><div class="why"></div>`;
}

function initSig(){
  const cv = $('#sigPad'); if(!cv) return;
  const dpr = window.devicePixelRatio || 1, rect = cv.getBoundingClientRect();
  cv.width = rect.width*dpr; cv.height = rect.height*dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a1f2b';
  if(D.sig){ const im = new Image(); im.onload = ()=> ctx.drawImage(im,0,0,rect.width,rect.height); im.src = D.sig; }
  let on = false;
  const pos = (e)=>{ const r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e;
                     return { x:t.clientX-r.left, y:t.clientY-r.top }; };
  const st = (e)=>{ e.preventDefault(); on = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const mv = (e)=>{ if(!on) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  const en = ()=>{ if(!on) return; on = false; D.sig = cv.toDataURL('image/png');
                   const m = $('.msg'); if(m){ m.textContent = '✅ تم تسجيل التوقيع'; m.className = 'msg ok'; }
                   sync(); };
  cv.onmousedown = st; cv.onmousemove = mv; window.onmouseup = en;
  cv.ontouchstart = st; cv.ontouchmove = mv; cv.ontouchend = en;
}
window.clearSig = function(){ D.sig = ''; render(); };

// ============================================================
// 🔐 §20 — عزل جلسة Firebase (نفس حكاية loyalty/glow)
//
// استمارة انضمام الموظفة كانت على التطبيق الافتراضي `[DEFAULT]` — نفس
// المساحة اللي فيها جلسة إيميل المالك في Office. أول ما موظفة تفتح رابط
// الدعوة، الدخول المجهول كان **بيمسح جلسة Office**.
// الحل: تطبيق باسمه = مساحة تخزين مستقلة.
//

const fbApp  = firebase.initializeApp(firebaseConfig, 'join');
const fbAuth = firebase.auth(fbApp);
const db     = firebase.firestore(fbApp);

let _anonPending = null;
function ensureAnonAuth(){
  try{
    if(!firebase.auth) return Promise.resolve();
    if(fbAuth.currentUser) return Promise.resolve();
    if(_anonPending) return _anonPending;
    _anonPending = fbAuth.signInAnonymously()
      .then(function(){ _anonPending = null; })
      .catch(function(e){ _anonPending = null; console.warn('anon auth', e && e.code); throw e; });
    return _anonPending;
  }catch(e){ _anonPending = null; return Promise.reject(e); }
}
// §18 القاعدة الذهبية — الملف فيه أكتر من <script>
window.fbApp = fbApp; window.fbAuth = fbAuth; window.ensureAnonAuth = ensureAnonAuth;
window.db = db;
/* FB-APP-INIT-END */
let INVITE = null, INVITE_CODE = '';

function gateFail(title, msg, body){
  document.getElementById('gateTitle').textContent = title;
  document.getElementById('gateMsg').textContent = msg;
  document.getElementById('gateBody').innerHTML = body || '';
}

async function openGate(){
  const q = new URLSearchParams(location.search);
  INVITE_CODE = String(q.get('c') || '').trim().toUpperCase();
  if(!INVITE_CODE){
    gateFail('رابط غير صالح', 'هذا الرابط لا يحتوي على كود دعوة.',
      '<div class="card c-bad"><b>⛔ لا يمكن فتح الاستمارة</b>'
      + '<p>يُرجى استخدام الرابط المُرسَل إليك من الإدارة كما هو، دون حذف أي جزء منه.</p></div>');
    return;
  }
  try{
    await ensureAnonAuth();
  }catch(e){
    gateFail('تعذّر الاتصال', 'يُرجى التأكد من الاتصال بالإنترنت وإعادة المحاولة.',
      '<div class="card c-bad"><b>⛔ ' + esc(e.code || e.message) + '</b></div>');
    return;
  }
  let d;
  try{
    const snap = await db.collection('staff_invites').doc(INVITE_CODE).get();
    if(!snap.exists) throw new Error('__NONE__');
    d = snap.data() || {};
  }catch(e){
    gateFail('الدعوة غير موجودة', 'الكود الموجود في الرابط غير معروف.',
      '<div class="card c-bad"><b>⛔ يُرجى مراجعة الإدارة</b>'
      + '<p>قد يكون الرابط منسوخًا بشكل ناقص. يُرجى فتحه من الرسالة مباشرة.</p></div>');
    return;
  }
  // ⏳ الصلاحية والاستعمال — الشرطان مكرّران في قواعد Firestore كمان،
  //    فالفحص هنا للعرض والسيرفر هو الحاسم.
  if(d.usedAt){
    gateFail('الدعوة مستخدَمة', 'تم استخدام هذا الرابط في تسجيل سابق.',
      '<div class="card c-warn"><b>⚠️ رابط لمرة واحدة</b>'
      + '<p>إذا لم تكمل التسجيل من قبل، يُرجى طلب رابط جديد من الإدارة.</p></div>');
    return;
  }
  if(d.expiresAt && Date.now() > Number(d.expiresAt)){
    gateFail('انتهت صلاحية الدعوة', 'انتهت مدة هذا الرابط.',
      '<div class="card c-warn"><b>⚠️ الرابط منتهٍ</b>'
      + '<p>يُرجى طلب رابط جديد من الإدارة.</p></div>');
    return;
  }
  if(!ROLES[d.role]){
    gateFail('الدعوة غير مكتملة', 'الوظيفة المحدَّدة في الدعوة غير معروفة.',
      '<div class="card c-bad"><b>⛔ يُرجى مراجعة الإدارة</b></div>');
    return;
  }
  INVITE = d;
  D.brand  = d.brand || 'echarpe';
  D.branch = d.branch || '';
  D.role   = d.role;
  document.getElementById('gate').style.display = 'none';
  document.getElementById('page').style.display = '';
  render();
}

// 📤 الإرسال: الطلب + المستندات + إغلاق الدعوة
// ⚠️ كل صورة في **مستند مستقل**: حد المستند في Firestore مليون بايت،
//    وخمس صور مضغوطة لا تدخل في مستند واحد.
async function submitAll(btn){
  const n = readNID(D.nid), r = ROLES[D.role];
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال…';
  try{
    const regRef = db.collection('sales_registrations').doc();
    const payload = {
      // الحقول التي يقرأها تطبيق الحضور عند الاعتماد — بالأسماء نفسها
      name: D.name.trim(), gender: D.gender, shift: D.shift, dayOff: D.dayOff,
      scheduledStartTime: SHIFTS[D.shift].raw24from, scheduledEndTime: SHIFTS[D.shift].raw24to,
      pin: D.pin, branch: D.branch, status: 'pending', ts: Date.now(), agreedAt: Date.now(),
      // الزيادة الخاصة بالاستمارة الخارجية
      source: 'join', inviteCode: INVITE_CODE,
      brand: D.brand, role: D.role, roleLabel: r.label, trialDays: r.trialDays,
      phone: D.phone, whatsapp: D.whatsapp || D.phone,
      nid: D.nid, birth: n.ok ? n.birth : '', gov: n.ok ? n.gov : '',
      emergency: { name: D.emgName, relation: D.emgRel, phone: D.emgPhone },
      address: D.address, eduType: D.eduType,
      agreements: { trial: !!D.ok.trial, rules: !!D.ok.rules, data: !!D.ok.data, truth: !!D.ok.true },
      docKeys: Object.keys(D.docs)
    };
    await regRef.set(payload);
    // المستندات — كل واحدة على حدة، وفشل واحدة لا يُسقِط الطلب
    const keys = Object.keys(D.docs);
    for(let i = 0; i < keys.length; i++){
      btn.textContent = 'جارٍ رفع المستندات ' + (i+1) + '/' + keys.length + '…';
      await db.collection('staff_docs').add({
        regId: regRef.id, inviteCode: INVITE_CODE, kind: keys[i], branch: D.branch, brand: D.brand,
        name: D.name.trim(), photo: D.docs[keys[i]].data, sizeKb: D.docs[keys[i]].size,
        ts: Date.now()
      });
    }
    if(D.sig){
      await db.collection('staff_docs').add({
        regId: regRef.id, inviteCode: INVITE_CODE, kind: 'signature', branch: D.branch, brand: D.brand,
        name: D.name.trim(), photo: D.sig, sizeKb: kb(D.sig), ts: Date.now()
      });
    }
    // إغلاق الدعوة — بعد نجاح كل ما سبق
    await db.collection('staff_invites').doc(INVITE_CODE)
      .update({ usedAt: Date.now(), regId: regRef.id, usedBy: D.name.trim() });
    SENT_ID = regRef.id;
    go(I('done'));
  }catch(e){
    btn.disabled = false; btn.textContent = 'إرسال الطلب';
    const w = $('.why');
    if(w) w.textContent = 'تعذّر الإرسال: ' + (e.code || e.message) + ' — يُرجى المحاولة مرة أخرى';
  }
}

function render(){
  const cur = S(), pi = PHASES.findIndex(p=> p.steps.indexOf(cur) >= 0);
  $('#bars').innerHTML = PHASES.map((p,i)=>{
    const w = i < pi ? 100 : (i > pi ? 0 : Math.round(((p.steps.indexOf(cur)+1)/p.steps.length)*100));
    return `<i><b style="width:${w}%"></b></i>`;
  }).join('');
  $('#phName').textContent = PHASES[pi].name;
  $('#phNum').textContent = (pi+1) + ' من ' + PHASES.length;

  // الترويسة بتقول الفرع اللي الدعوة اتعملت عليه — مش قايمة اختيارات
  $('#logo').textContent = D.brand === 'glow' ? 'Glow' : 'echarpe';
  $('#brs').textContent = D.branch || '';

  $('#body').innerHTML = V[cur]();
  sync();
  if(cur === 'sign') initSig();
  const f = document.querySelector('[data-focus]');
  if(f) setTimeout(()=>{ try{ f.focus(); }catch(e){} }, 130);
}
